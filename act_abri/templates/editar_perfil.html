{% extends "base.html" %}

{% block titulo %}
<h1 class="text-center mt-3">Editar Perfil</h1>
{% endblock %}

{% block contenido %}

<div class="container my-5 pt-4">

    <div class="card shadow-lg p-4 rounded-4 mx-auto"
        style="background-color: #F5E6E8; max-width: 450px;">

        <h3 class="text-center mb-4" style="color:#5A5A5A;">
            EDITAR INFORMACIÓN
        </h3>

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">NOMBRE</label>
                <input type="text"
                       name="nombre"
                       class="form-control"
                       value="{{ usuario.nombre }}"
                       required>
            </div>

            <div class="mb-3">
                <label class="form-label">EMAIL</label>
                <input type="email"
                       name="email"
                       class="form-control"
                       value="{{ usuario.email }}"
                       required>
            </div>

            <button type="submit"
                class="btn w-100"
                style="background-color:#C8A2AA; color:white; border-radius:10px;">
                GUARDAR CAMBIOS
            </button>

        </form>

    </div>
</div>

{% endblock %}
